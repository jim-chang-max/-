<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离散数学期末复习 - 登录</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-title">离散数学期末复习</span>
        <span class="brand-subtitle">登录后保存错题、计划和测验记录</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="topics.html">知识点</a>
        <a href="questions.html">题库</a>
        <a href="mistakes.html">错题本</a>
        <a href="plan.html">复习计划</a>
        <a href="quiz.html">测验</a>
        <a href="graph.html">知识图谱</a>
        <a href="login.html">登录</a>
      </nav>
      <span class="tag" data-user-status>读取中</span>
    </div>
  </header>

  <main class="main">
    <section class="card login-card">
      <h1 class="page-title">登录 / 注册</h1>
      <p class="page-desc">示例账号：demo，密码：secret。</p>

      <form id="loginForm" class="grid" style="margin-top: 18px;">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="button-row">
          <button class="button primary" type="submit" data-action="login">登录</button>
          <button class="button" type="submit" data-action="register">注册</button>
        </div>
        <p class="muted" id="loginMessage"></p>
      </form>
    </section>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
