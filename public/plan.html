<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离散数学期末复习 - 复习计划</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-title">离散数学期末复习</span>
        <span class="brand-subtitle">按考试日期拆解每日任务</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="topics.html">知识点</a>
        <a href="questions.html">题库</a>
        <a href="mistakes.html">错题本</a>
        <a href="plan.html">复习计划</a>
        <a href="quiz.html">测验</a>
        <a href="graph.html">知识图谱</a>
        <a href="login.html">登录</a>
      </nav>
      <span class="tag" data-user-status>读取中</span>
    </div>
  </header>

  <main class="main">
    <section class="page-header">
      <div>
        <h1 class="page-title">复习计划</h1>
        <p class="page-desc">输入考试日期后，系统会根据章节顺序生成每日复习任务。</p>
      </div>
    </section>

    <form class="card form-row" id="planForm">
      <div class="field">
        <label for="examDate">考试日期</label>
        <input id="examDate" type="date" required>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="button primary" type="submit">生成计划</button>
      </div>
      <div class="field">
        <label>当前计划</label>
        <span class="tag" id="planSummary">未读取</span>
      </div>
    </form>

    <section class="grid grid-2" id="planList"></section>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/plan.js"></script>
</body>
</html>
